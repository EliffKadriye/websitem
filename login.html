<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş Yap | Öğrenci Paneli</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
        <div class="container">
            <a class="navbar-brand" href="index.html">Öğrenci Paneli</a>
        </div>
    </nav>

    <div class="container" id="app">
        <div class="row justify-content-center align-items-center" style="min-height: 80vh;">
            <div class="col-md-4">
                <div class="card shadow-lg border-0 rounded-4">
                    <div class="card-body p-5">
                        <div class="text-center mb-4">
                            <h2 class="fw-bold">Giriş Yap</h2>
                            <p class="text-muted">Öğrenci bilgilerinizle erişim sağlayın</p>
                        </div>

                        <form id="loginForm" action="login_kontrol.php" method="POST" @submit="validateForm">
                            <div class="mb-3">
                                <label class="form-label">Kullanıcı Adı (E-posta)</label>
                                <input type="email" name="email" v-model="email" class="form-control" placeholder="b251210037@sakarya.edu.tr">
                            </div>
                            
                            <div class="mb-4">
                                <label class="form-label">Şifre</label>
                                <input type="password" name="password" v-model="password" class="form-control" placeholder="Elif.10115346696">
                            </div>

                            <button type="submit" class="btn btn-primary w-100">Giriş Yap</button>
                        </form>
                        
                        <div v-if="errorMsg" class="alert alert-danger mt-3 py-2 text-center" role="alert">
                            {{ errorMsg }}
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const { createApp } = Vue;
        createApp({
            data() {
                return {
                    email: '',
                    password: '',
                    errorMsg: ''
                }
            },
            methods: {
                validateForm(e) {
                    this.errorMsg = "";
                    // Boş alan kontrolü 
                    if (!this.email || !this.password) {
                        this.errorMsg = "Lütfen tüm alanları doldurunuz.";
                        e.preventDefault();
                        return;
                    }
                    // Basit mail format kontrolü 
                    if (!this.email.includes('@sakarya.edu.tr')) {
                        this.errorMsg = "Lütfen geçerli bir Sakarya e-posta adresi giriniz.";
                        e.preventDefault();
                    }
                }
            }
        }).mount('#app');
    </script>
</body>
</html>
