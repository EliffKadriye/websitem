            <div class="card-body p-4">

                        </div>
                        <div class="col-md-3">

                            <input type="date" name="dogumtarihi" class="form-control">
                        </div>
                        <div class="col-md-3">

                        </div>
 
                        <div class="col-md-6">
                            <label class="form-label fw-semibold d-block">Cinsiyet</label>

                                <input class="form-check-input" type="radio" name="cinsiyet" value="Erkek">

                            </div>
                            <div class="form-check form-check-inline">

                        <!-- BUTONLAR -->
                        <div class="col-12 mt-4">
                            <div class="d-flex flex-wrap gap-2 justify-content-center">
                                <!-- Sadece denetler, göndermez -->
                                <button type="button" class="btn btn-warning" onclick="validateNativeJS()">
                                    🔍 Native JS ile Denetle
                                </button>
                                <button type="button" class="btn btn-info text-white" @click="validateVueJS">
                                    🔍 Vue.js ile Denetle
                                </button>
                                <!-- Direkt gönderir (browser kendi validasyonunu da yapar) -->
                                <button type="submit" class="btn btn-success">
                                    🚀 Gönder
                                </button>
                                <button type="reset" class="btn btn-secondary" onclick="clearResult()">
                                    🔄 Sıfırla
                                </button>
                            </div>
                            <p class="text-muted text-center mt-2" style="font-size:0.85rem;">

    <script>
        // ─── Ortak yardımcı fonksiyon ────────────────────────────────
        function showResult(type, messages) {
            const el = document.getElementById('validationResult');
            if (type === 'success') {
                el.innerHTML = `
                    <div class="alert alert-success alert-dismissible fade show" role="alert">
                        <strong>✅ Denetim Başarılı!</strong> ${messages}
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>`;
            } else {
                const list = Array.isArray(messages)
                    ? '<ul class="mb-0 mt-1">' + messages.map(m => `<li>${m}</li>`).join('') + '</ul>'
                    : messages;
                el.innerHTML = `
                    <div class="alert alert-danger alert-dismissible fade show" role="alert">
                        <strong>❌ Hata!</strong> ${list}
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>`;
            }
            el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }
 
        function clearResult() {
            document.getElementById('validationResult').innerHTML = '';
        }
 
        // ─── 1. NATIVE JAVASCRIPT DENETİMİ ──────────────────────────
        // Sadece denetler — form.submit() ÇAĞIRMAZ
        function validateNativeJS() {
            const form   = document.getElementById('contactForm');
            const ad     = form.ad.value.trim();
            const email  = form.email.value.trim();
            const telefon = form.telefon.value.trim();
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            const errors = [];
 
            if (ad === '')              errors.push('Ad Soyad boş bırakılamaz.');
            if (email === '')           errors.push('E-Posta boş bırakılamaz.');
            else if (!emailRegex.test(email)) errors.push('Geçersiz e-posta formatı.');
            if (telefon === '')         errors.push('Telefon boş bırakılamaz.');
            else if (isNaN(telefon.replace(/[\s\-\+]/g, ''))) errors.push('Telefon yalnızca rakam içermelidir.');
 
            if (errors.length > 0) {
                showResult('error', errors);
            } else {
                showResult('success', 'Tüm alanlar (Native JS) geçerli görünüyor. Göndermek için "Gönder" butonuna tıklayın.');
            }
        }
 
        // ─── 2. VUE.JS DENETİMİ ─────────────────────────────────────
        const { createApp } = Vue;
        createApp({
            data() {
                return {
                    formData: { ad: '', email: '', telefon: '', parola: '' }
                };
            },
            methods: {
                // Sadece denetler — form.submit() ÇAĞIRMAZ
                validateVueJS() {
                    const errors = [];
                    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
 
                    if (!this.formData.ad.trim())
                        errors.push('Ad Soyad boş bırakılamaz.');
                    if (!this.formData.email.trim())
                        errors.push('E-Posta boş bırakılamaz.');
                    else if (!emailRegex.test(this.formData.email))
                        errors.push('Geçerli bir e-posta adresi giriniz.');
                    if (!this.formData.telefon.trim())
                        errors.push('Telefon boş bırakılamaz.');
 
                    if (errors.length > 0) {
                        showResult('error', errors);
                    } else {
                        showResult('success', 'Tüm alanlar (Vue.js) geçerli görünüyor. Göndermek için "Gönder" butonuna tıklayın.');
                    }
                }
            }
        }).mount('#app');
    </script>
 
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
